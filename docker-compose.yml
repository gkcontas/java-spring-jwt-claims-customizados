services:
  postgres:
    image: postgres:16-alpine
    container_name: tenantauth-postgres
    environment:
      POSTGRES_DB: tenantauth
      POSTGRES_USER: tenantauth
      POSTGRES_PASSWORD: tenantauth
    ports:
      - "5432:5432"
    volumes:
      - tenantauth-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantauth -d tenantauth"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tenantauth-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tenantauth-pgdata:
